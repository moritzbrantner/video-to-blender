[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-blender"
version = "0.0.1"
description = "PROTOTYPE: staged video-to-Blender reconstruction with LingBot-Map"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
lingbot = [
  "numpy<3",
  "ultralytics>=8.3",
]

[project.scripts]
v2b = "video_to_blender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

